<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="55%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#050B1A"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#g)"/>

  <!-- eyebrow -->
  <text x="90" y="150" fill="#3B82F6" font-size="26" letter-spacing="6" font-weight="500" font-family="'JetBrains Mono',monospace">FULL-SERVICE MARKETING · PROFESSIONAL SERVICES</text>

  <!-- headline -->
  <text x="86" y="300" fill="#FFFFFF" font-size="104" font-weight="700" letter-spacing="-3">Be the firm</text>
  <text x="86" y="420" fill="url(#g)" font-size="104" font-weight="700" letter-spacing="-3">AI recommends.</text>

  <!-- subhead -->
  <text x="90" y="500" fill="#9AA7BD" font-size="32" font-weight="400">GEO · SEO · Web · Paid — one accountable team.</text>

  <!-- wordmark bottom-left -->
  <text x="90" y="585" fill="#FFFFFF" font-size="34" font-weight="700" letter-spacing="-1">GEO<tspan fill="#2563EB">.</tspan> <tspan fill="#9AA7BD" font-weight="500" font-size="26">Marketing Group</tspan></text>

  <!-- url bottom-right -->
  <text x="1110" y="585" fill="#9AA7BD" font-size="24" text-anchor="end" font-family="'JetBrains Mono',monospace">geomarketinggroup.org</text>
</svg>
