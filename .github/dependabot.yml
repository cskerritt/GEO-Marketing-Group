version: 2

updates:
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
    groups:
      website-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /audit-tool
    schedule:
      interval: weekly
      day: monday
    groups:
      audit-tool-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
